# Params for hardware_interface_node.
#
# NOTE on control_rate_hz: this is the *nominal* timer rate the node
# aims for. It is NOT assumed to be the real achievable rate -- the node
# measures actual elapsed time between ticks at runtime and uses that
# (not 1/control_rate_hz) to integrate velocity -> position, precisely
# so a mismatch here can't silently produce wrong-speed motion. If you
# see repeated "tick overrun" warnings in /diagnostics after running this
# against the real arm, lower this value to match what the bus can
# actually sustain -- see HANDOFF.md Step 2 rate discussion.
hardware_interface_node:
  ros__parameters:
    port: "/dev/ttyACM0"
    robot_id: "vihu2"
    control_rate_hz: 100.0

    # All 6 real joints, in the order SOFollower's observation/action
    # dicts use ("<name>.pos"). Matches robot_params.yaml naming.
    joint_names:
      - "shoulder_pan"
      - "shoulder_lift"
      - "elbow_flex"
      - "wrist_flex"
      - "wrist_roll"
      - "gripper"

    joint_cmd_timeout_ms: 100   # staleness on /joint_cmd_safe -> hold position, zero velocity
    tick_overrun_warn_ratio: 1.5  # warn if actual tick dt > this * nominal dt
