# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    body_grp_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    eef_grp_controller:
      type: position_controllers/GripperActionController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

body_grp_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
eef_grp_controller:
  ros__parameters:
    joint: gripper